databaseChangeLog:
  - changeSet:
      id: 005-criar-tabela-matricula
      author: matricula-online
      changes:
        - createTable:
            tableName: matricula
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: uuid
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: aluno_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_matricula_aluno
                    references: aluno(id)
              - column:
                  name: turma_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_matricula_turma
                    references: turma(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDENTE
                  constraints:
                    nullable: false
              - column:
                  name: data_matricula
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: matricula
            indexName: idx_matricula_aluno_turma
            columns:
              - column:
                  name: aluno_id
              - column:
                  name: turma_id
